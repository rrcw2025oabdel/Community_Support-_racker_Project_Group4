<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="eventstyles.css" />
    <script src="eventscript.js"defer></script>
    <script src="script.js" defer></script>
    <title>Community Support Tracker Project</title>
</head>
<body>
    <header class="main-header">
        <div class="container header-content">

            <!-- Logo -->
            <div class="logo">
                <img src="images/logo.png" alt="Logo">
            </div>

            <!-- Navigation Menu -->
             <nav class="main-nav" id="navMenu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="donation.html">Donation Tracker</a></li>
                    <li><a href="volunteer.html">Volunteer Hours</a></li>
                    <li><a href="events.html">Event Signup</a></li>
                </ul>
            </nav>

            <!-- Hamburger Menu -->
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    </header>
    <main class ="main-container">
        <form id="event-form">
            <h1> Event Signup</h1>
            <p> Sign up your representative today!</p>
            <div class="event-radio-group">
                <p id="radio-title">Select your Event:</p>
                    <div class="radio-options">
                        <label for="option1">Community Cleanup
                        <input type="radio" id="option1" name="event-type" value="Cleanup">
                        </label>
                        <label for="option2">Food Drive
                        <input type="radio" id="option2" name="event-type" value="Food-Drive">
                        </label>
                        <label for="option3">Fundraising Dinner
                        <input type="radio" id="option3" name="event-type" value="Fundraiser">
                        </label>
                    </div>
            </div>
            <div class="first-name">
                <label>First Name:</label>
                <input type="text" id="first-name" name="first-name">
            </div>
            <div class="last-name">
                <label> Last Name:</label>
                <input type="text" id="last-name" name="last-name">
            </div>
            <div class="email-class">
                <label> Email:</label>
                <input type="email" id="email">
            </div>
            <div class="dropdown">
                    <select id="participant" name="participant-dropdown">
                        <option value="choose">Choose your Event Role:</option>
                        <option value="Sponsor">Sponsor</option>
                        <option value="Participant">Participant</option>
                        <option value="Organizer">Organizer</option>
                    </select>
            </div>
            <button class="submit-button">Sign Up</button>
        </form>
        <div class="table">
            <table>
                <h2>Participant Signup</h2>
                    <thead>
                        <tr>
                            <th>Event Name</th>
                            <th>Participant Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody id="signup-table-body">
                
                    </tbody>
            </table>
                <h2>Upcoming Events Summary</h2>
                    <div id="summary-section">
                        
                    </div>
        </div>
    </main>
    <footer class="main-footer">
        <div class="container">
            <p>© 2025 PiXELL River Financial — Community Support</p>
        </div>
    </footer>
    <script src="eventscript.js"></script>

</body>
</html>
