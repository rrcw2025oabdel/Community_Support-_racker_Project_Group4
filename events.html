<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <title>Community Support Tracker Project</title>
</head>
<body>
    <header>
        <h1>Community</h1>
    <nav>
        <ul>
            <li><a href="donation.html">Donation Tracker</a></li>
            <li><a href="volunteer.html">Volunteer Hours</a></li>
            <li><a href="events.html">Event Signup</a></li>
        </ul>
    </nav>
    </header>
    <main>
        <form>
            <h2> Event Signup</h2>
            <p> Sign up your representative today!</p>
            <label>Select your Event:</label>
            <div class="event-radio-group">
                <label for="option1">Community Cleanup
                    <input type="radio" id="option1" name="event-type" value="cleanup">
                </label>
                <label for="option2">Food Drive
                    <input type="radio" id="option2" name="event-type" value="food-drive">
                </label>
                <label for="option3">Fundraising Dinner
                    <input type="radio" id="option3" name="event-type" value="fundraiser">
                </label>
            </div>
            <div class="rep-name-group">
                <div class="field-name">
                    <label>First Name:</label>
                    <input type="text" id="first-name" name="first-name">
                </div>
                <div class="field-name">
                    <label> Last Name:</label>
                    <input type="text" id="last-name" name="last-name">
                </div>
            </div>
            <div class="additional-info">
                <label> Email:</label>
                <input type="email">
                <div class="dropdown">
                    <select>
                        <option>Choose your Event Role:</option>
                        <option>Sponsor</option>
                        <option>Participant</option>
                        <option>Organizer</option>
                    </select>
                </div>
            </div>
            <button>Sign Up</button>
        </form>

    </main>
    <footer>
        <p>&copy; 2025 Community Sign up</p>
    </footer>
</body>
</html>
