    <main>
        <form>
            <h2> Event Signup</h2>
            <p> Sign up your representative today!</p>
            <label>Select your Event:</label>
            <div class="event-radio-group">
                <label for="option1">Community Cleanup
                    <input type="radio" id="option1" name="event-type" value="cleanup">
                </label>
                <label for="option2">Food Drive
                    <input type="radio" id="option2" name="event-type" value="food-drive">
                </label>
                <label for="option3">Fundraising Dinner
                    <input type="radio" id="option3" name="event-type" value="fundraiser">
                </label>
            </div>
            <div class="rep-input-group">
                <label>First Name:</label>
                <input type="text">
                <label> Last Name:</label>
                <input type="text">
                <label> Email:</label>
                <input type="email">
            </div>
            <div class="dropdown">
                <select>
                    <option>Choose your Event Role:</option>
                    <option>Sponsor</option>
                    <option>Participant</option>
                    <option>Organizer</option>
                </select>
            </div>
            <button>Sign Up</button>
        </form>

    </main>
    <footer>
        <p></p>
    </footer>
</body>
