<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <title>Community Support Tracker Project</title>
</head>
<body>
     <header>
        <h1>Community</h1>
    <nav>
        <ul>
            <li><a href="donation.html">Donation Tracker</a></li>
            <li><a href="volunteer.html">Volunteer Hours</a></li>
            <li><a href="events.html">Event Signup</a></li>
        </ul>
    </nav>
    </header>
    <main>
        <form id="volunteer-hours-tracker">
            <h2>Volunteer Hours Tracker</h2>
                <div class="input-container">
                    <label for="charity">Charity Name:</label>
                    <input type="text" id="charity" name="charity">
                </div>

                <div class="input-container">
                    <label for="hours">Total Hours Volunteered</label>
                    <input type="number" id="hours" name="hours">
                </div>

                <div class="input-container">
                    <label for="date">Date of Volunteering Occurence:</label>
                    <input type="date" id="date" name="date">
                </div>

                <div class="input-container">
                    <label for="rating">Rate your volunteering experience [1-5]</label>
                    <input type="number" id="rating" name="rating">
                </div>
                <button type="submit">Submit</button>
        </form>
    </main>
    <footer class="main-footer">
        <div class="container">
            <p>© 2025 PiXELL River Financial — Community Support</p>
        </div>
    </footer>
    <script src="volunteer.js"></script>
</body>
</html>
